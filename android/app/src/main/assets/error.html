<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seite nicht erreichbar</title>
<style>
  html, body { margin: 0; height: 100%; background: #1C1A33; color: #EEE7E2; font: 15px/1.6 "Segoe UI", Roboto, system-ui, sans-serif; }
  main { max-width: 560px; padding: 18vh 32px 0; margin: 0 auto; }
  .seal { width: 44px; height: 44px; display: grid; place-items: center; background: #D9566F; color: #FBEFEF; font: 600 26px "Yu Mincho", "Noto Serif JP", serif; border-radius: 4px; transform: rotate(-4deg); margin-bottom: 28px; }
  h1 { font: 400 30px/1.25 "Yu Mincho", "Noto Serif JP", Georgia, serif; margin: 0 0 12px; }
  p { color: #A59EB8; margin: 0 0 10px; word-break: break-word; }
  code { color: #EEE7E2; }
  button { margin-top: 18px; height: 38px; padding: 0 18px; border: 0; border-radius: 9px; background: #F2B3C5; color: #16142A; font: 600 14px inherit; cursor: pointer; }
  .seal.warn { transform: none; border-radius: 50%; }
  .link { display: inline-block; margin: 22px 0 0 14px; color: #A59EB8; background: none; height: auto; padding: 0; font-weight: 400; text-decoration: underline; }
  button:focus-visible { outline: 2px solid #EEE7E2; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="seal">桜</div>
  <h1 id="h">Diese Seite ist nicht erreichbar</h1>
  <p id="host"></p>
  <p id="hint"></p>
  <button id="retry">Erneut versuchen</button>
  <button id="anyway" class="link" hidden>Trotzdem öffnen (nicht empfohlen)</button>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const u = q.get('u') || '', d = q.get('d') || '', code = Number(q.get('c'));
  let host = u; try { host = new URL(u).hostname; } catch {}
  const hints = {
    '-105': ['Adresse nicht gefunden', `Unter „${host}“ gibt es keine Seite. Prüf die Schreibweise.`],
    '-106': ['Keine Internetverbindung', 'Prüf WLAN oder Netzwerkkabel und versuch es dann noch einmal.'],
    '-102': ['Verbindung abgelehnt', `${host} nimmt gerade keine Verbindungen an.`],
    '-118': ['Zeitüberschreitung', `${host} hat zu lange nicht geantwortet.`],
    '-7': ['Zeitüberschreitung', `${host} hat zu lange nicht geantwortet.`],
    '-200': ['Unsicheres Zertifikat', 'Die Verbindung ist nicht vertrauenswürdig. Gib hier keine Daten ein.'],
    '-201': ['Zertifikat abgelaufen oder Uhrzeit falsch', 'Prüf, ob Datum und Uhrzeit deines Geräts stimmen.'],
    '-202': ['Unsicheres Zertifikat', 'Die Verbindung ist nicht vertrauenswürdig. Gib hier keine Daten ein.']
  };
  if (q.get('c') === 'phish') {
    hints.phish = ['Achtung: Betrugsverdacht', `${host} steht auf einer Liste bekannter Betrugs- und Phishing-Seiten. Solche Seiten versuchen, Passwörter, Bankdaten oder Zahlungen zu stehlen. Gib hier nichts ein.`];
    document.querySelector('.seal').classList.add('warn');
    document.querySelector('.seal').textContent = '!';
    const r = document.getElementById('retry');
    r.textContent = 'Zurück in Sicherheit';
    r.onclick = () => { if (history.length > 1) history.back(); else location.href = 'sakura://newtab/'; };
    const a = document.getElementById('anyway');
    if (window.sakura && /^https?:/i.test(u)) {
      a.hidden = false;
      a.onclick = async () => { if (await window.sakura.call('phishAllow', u)) location.replace(u); };
    }
  }
  if (q.get('c') === 'focus') {
    const until = (q.get('t') || '').replace(/[^0-9:]/g, '').slice(0, 5);
    hints.focus = ['Fokus-Zeit', `${host} hast du für deine Fokus-Zeit gesperrt.${until ? ` Ab ${until} Uhr ist die Seite wieder offen.` : ''} Du schaffst das!`];
    document.querySelector('.seal').textContent = '集';
    const r = document.getElementById('retry');
    r.textContent = 'Zurück';
    r.onclick = () => { if (history.length > 1) history.back(); else location.href = 'sakura://newtab/'; };
  }
  const h = hints[q.get('c') === 'phish' ? 'phish' : q.get('c') === 'focus' ? 'focus' : String(code)];
  if (h) { document.getElementById('h').textContent = h[0]; document.getElementById('hint').textContent = h[1]; }
  else document.getElementById('hint').textContent = d ? `Fehler: ${d}` : '';
  document.getElementById('host').textContent = u;
  document.title = h ? h[0] : 'Seite nicht erreichbar';
  if (q.get('c') !== 'phish' && q.get('c') !== 'focus') document.getElementById('retry').onclick = () => { if (/^https?:/i.test(u)) location.href = u; };
</script>
</body>
</html>

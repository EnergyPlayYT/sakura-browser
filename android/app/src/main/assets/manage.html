<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sakura</title>
<style>
  :root {
    --yoru: #1C1A33; --kasumi: #28254A; --fukai: #16142A; --washi: #EEE7E2; --usuzumi: #A59EB8; --sakura: #F2B3C5; --beni: #D9566F;
    --err: #FFB4C0; --washi-rgb: 238, 231, 226; --sakura-rgb: 242, 179, 197;
    --line: rgba(var(--washi-rgb), .09);
    --mincho: "Noto Serif JP", "Noto Serif CJK JP", "Noto Serif", Georgia, serif;
    --gothic: Roboto, system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--yoru); color: var(--washi); font: 15px/1.5 var(--gothic); }
  nav { position: sticky; top: 0; z-index: 2; display: flex; gap: 4px; padding: 12px 12px 0; background: var(--yoru); border-bottom: 1px solid var(--line); }
  nav { overflow-x: auto; scrollbar-width: none; } nav::-webkit-scrollbar { display: none; }
  nav a { flex: 1 0 auto; text-align: center; padding: 10px 8px 12px; font-size: 15px !important; color: var(--usuzumi); text-decoration: none; font: 17px var(--mincho); position: relative; }
  nav a.on { color: var(--washi); }
  nav a.on::after { content: ""; position: absolute; left: 30%; right: 30%; bottom: -1px; height: 2px; border-radius: 2px; background: var(--sakura); }
  main { padding: 12px 12px 48px; max-width: 680px; margin: 0 auto; }
  input, select, textarea {
    width: 100%; font: 15px var(--gothic); color: var(--washi); background: var(--fukai); border: 0; outline: 0;
    border-radius: 10px; padding: 0 12px; height: 44px; box-shadow: inset 0 0 0 1px var(--line);
  }
  textarea { height: 96px; padding: 10px 12px; resize: vertical; }
  input:focus, select:focus, textarea:focus { box-shadow: inset 0 0 0 1.5px var(--sakura); }
  .search { margin-bottom: 8px; }
  .day { font: 16px var(--mincho); color: var(--usuzumi); margin: 18px 6px 6px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 6px; border-radius: 10px; }
  .item:active { background: rgba(var(--washi-rgb), .06); }
  .fav { width: 32px; height: 32px; flex: none; border-radius: 6px; display: grid; place-items: center; font: 600 14px var(--mincho); color: var(--sakura); background: rgba(var(--sakura-rgb), .14); }
  .txt { flex: 1; min-width: 0; }
  .txt div, .txt small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .txt small { display: block; color: var(--usuzumi); font-size: 13px; }
  time { color: var(--usuzumi); font-size: 13px; }
  .ib { width: 40px; height: 40px; flex: none; border: 0; border-radius: 10px; background: none; color: var(--usuzumi); font-size: 18px; }
  .ib:active { background: rgba(var(--washi-rgb), .1); }
  .empty { color: var(--usuzumi); padding: 28px 8px; line-height: 1.6; }
  .edit { display: grid; gap: 8px; padding: 10px; border-radius: 12px; background: rgba(0, 0, 0, .18); margin: 4px 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .btn { height: 42px; padding: 0 16px; border: 0; border-radius: 10px; font: 15px var(--gothic); color: var(--washi); background: rgba(var(--washi-rgb), .1); }
  .btn.primary { background: var(--sakura); color: var(--fukai); font-weight: 600; }
  .btn.danger { color: var(--err); }
  .btn:disabled { opacity: .5; }
  section { padding: 16px 6px; border-top: 1px solid var(--line); }
  section:first-child { border-top: 0; }
  h2 { margin: 0 0 10px; font: 400 21px var(--mincho); }
  p { color: var(--usuzumi); margin: 4px 0 12px; line-height: 1.55; }
  label.f { display: grid; gap: 6px; margin-bottom: 12px; color: var(--usuzumi); font-size: 14px; }
  .sw { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
  .sw input { appearance: none; -webkit-appearance: none; width: 42px; height: 24px; padding: 0; border-radius: 12px; background: rgba(var(--washi-rgb), .2); position: relative; flex: none; box-shadow: none; }
  .sw input::after { content: ""; position: absolute; width: 18px; height: 18px; top: 3px; left: 3px; border-radius: 50%; background: var(--washi); transition: transform .15s; }
  .sw input:checked { background: var(--sakura); }
  .sw input:checked::after { transform: translateX(18px); background: var(--fukai); }
  .status { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; background: rgba(0, 0, 0, .18); margin-bottom: 12px; }
  .status i { width: 9px; height: 9px; border-radius: 50%; background: var(--usuzumi); flex: none; }
  .status.ok i { background: #9FD8B0; }
  .status.error i { background: var(--beni); }
  .status.syncing i { background: var(--sakura); }
  .err { color: var(--err); }
  details summary { color: var(--sakura); margin: 6px 0; }
  details ol { padding-left: 20px; color: var(--usuzumi); line-height: 1.6; }
  code { color: var(--washi); background: rgba(0, 0, 0, .25); padding: 1px 5px; border-radius: 4px; }
  .device h3 { margin: 14px 6px 2px; font: 400 17px var(--mincho); }
  .device h3 small { font: 12.5px var(--gothic); color: var(--usuzumi); margin-left: 6px; }
  .script { display: flex; align-items: center; gap: 12px; padding: 12px 6px; border-radius: 10px; }
  .script .txt { flex: 1; min-width: 0; }
  textarea.code { min-height: 260px; font: 13px/1.45 "Roboto Mono", monospace; white-space: pre; }
  textarea.matches { min-height: 72px; font: 13px/1.45 "Roboto Mono", monospace; }
  .themes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
  .theme { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 10px; border: 0; border-radius: 10px; background: none; color: var(--washi); font: 14px var(--gothic); text-align: left; box-shadow: inset 0 0 0 1px var(--line); }
  .theme.on { box-shadow: inset 0 0 0 2px var(--sakura); }
  .theme i { width: 24px; height: 24px; flex: none; border-radius: 50%; background: linear-gradient(135deg, var(--t-bg) 50%, var(--t-ac) 50%); box-shadow: 0 0 0 1px rgba(var(--washi-rgb), .25); }
  .theme span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .accent { display: flex; align-items: center; gap: 12px; color: var(--usuzumi); }
  .accent input { width: 52px; height: 36px; padding: 0; background: none; box-shadow: none; }
  .dl .bar { height: 4px; margin-top: 6px; border-radius: 2px; background: rgba(var(--washi-rgb), .12); overflow: hidden; }
  .dl .bar i { display: block; height: 100%; background: var(--sakura); border-radius: 2px; transition: width .4s; }
  .dl .txt small.failed { color: var(--err); }
  .dl .fav { font-size: 11px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<nav>
  <a href="#bookmarks" id="t-bookmarks">Lesezeichen</a>
  <a href="#history" id="t-history">Verlauf</a>
  <a href="#downloads" id="t-downloads">Downloads</a>
  <a href="#scripts" id="t-scripts">Skripte</a>
  <a href="#settings" id="t-settings">Einstellungen</a>
</nav>
<main id="main"></main>
<script src="themes.js"></script>
<script>
function nativeBridge(port) {
  let n = 0; const wait = {};
  port.onmessage = e => { const m = JSON.parse(e.data); if (wait[m.id]) { wait[m.id](m.result); delete wait[m.id]; } };
  return { call: (cmd, arg) => new Promise(res => { const id = ++n; wait[id] = res; port.postMessage(JSON.stringify({ id, cmd, arg: arg === undefined ? null : arg })); }) };
}
const api = window.sakuraNative ? nativeBridge(window.sakuraNative) : { call: async () => null };
const $ = s => document.querySelector(s);
const main = $('#main');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };
const letter = t => (String(t || '?').replace(/^https?:\/\/(www\.)?/, '').trim()[0] || '?').toUpperCase();
const lines = v => v.split(/\n/).map(x => x.trim()).filter(Boolean);

// Design aus den Einstellungen übernehmen (gemeinsam mit dem PC: themes.js)
async function applyTheme(p) {
  p = p || (await api.call('prefs')) || {};
  if (window.SakuraThemes) SakuraThemes.apply(document.documentElement, p);
}
applyTheme();

function route() {
  const k = (location.hash || '#bookmarks').slice(1);
  for (const a of document.querySelectorAll('nav a')) a.classList.toggle('on', a.id === 't-' + k);
  document.title = { bookmarks: 'Lesezeichen', history: 'Verlauf', downloads: 'Downloads', settings: 'Einstellungen', scripts: 'Eigene Skripte' }[k] || 'Sakura';
  clearTimeout(dlTimer);
  ({ bookmarks, history, downloads, settings, scripts }[k] || bookmarks)();
}
addEventListener('hashchange', route);

function item(it, extra) {
  return `<div class="item" data-id="${esc(it.id)}"><span class="fav">${esc(letter(it.title || it.url))}</span>
    <div class="txt" data-url="${esc(it.url)}"><div>${esc(it.title || it.url)}</div><small>${esc(host(it.url))}</small></div>${extra}</div>`;
}
// ---------------- Lesezeichen
async function bookmarks(filter = '') {
  const all = (await api.call('bookmarks')) || [];
  const q = filter.toLowerCase();
  const list = all.filter(b => !q || (b.title || '').toLowerCase().includes(q) || b.url.toLowerCase().includes(q));
  const keep = document.activeElement && document.activeElement.classList.contains('search');
  main.innerHTML = `<input class="search" placeholder="Lesezeichen durchsuchen" value="${esc(filter)}">` +
    (list.length ? (() => {
      // Ohne Ordner zuerst, dann jeder Ordner als Gruppe (Ordner legst du am PC an)
      const acts = `<button class="ib" data-act="edit" aria-label="Bearbeiten">✎</button><button class="ib" data-act="del" aria-label="Löschen">✕</button>`;
      const groups = new Map([['', []]]);
      for (const b of list) { const f = b.folder || ''; if (!groups.has(f)) groups.set(f, []); groups.get(f).push(b); }
      const folders = [...groups.keys()].filter(Boolean).sort((x, y) => x.localeCompare(y, 'de'));
      return groups.get('').map(b => item(b, acts)).join('') +
        folders.map(f => `<details open><summary class="day">${esc(f)} (${groups.get(f).length})</summary>${groups.get(f).map(b => item(b, acts)).join('')}</details>`).join('');
    })()
      : `<p class="empty">${all.length ? 'Keine Treffer.' : 'Noch keine Lesezeichen. Tipp in der Adressleiste auf den Stern, um eine Seite zu speichern.'}</p>`);
  const s = main.querySelector('.search');
  if (keep) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
  s.oninput = () => bookmarks(s.value);
  main.onclick = e => {
    const t = e.target.closest('.txt');
    if (t) return api.call('openUrl', t.dataset.url);
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const row = b.closest('.item');
    const bm = all.find(x => x.id === row.dataset.id);
    if (b.dataset.act === 'del') api.call('removeBookmark', bm.id).then(() => bookmarks(s.value));
    if (b.dataset.act === 'edit') {
      const f = document.createElement('div');
      f.className = 'edit';
      f.innerHTML = `<input data-k="title" value="${esc(bm.title)}" aria-label="Name"><input data-k="url" value="${esc(bm.url)}" aria-label="Adresse">
        <div class="row"><button class="btn" data-x="no">Abbrechen</button><button class="btn primary" data-x="ok">Speichern</button></div>`;
      row.replaceWith(f);
      f.onclick = ev => {
        ev.stopPropagation();
        const x = ev.target.dataset.x;
        if (x === 'no') bookmarks(s.value);
        if (x === 'ok') api.call('updateBookmark', { id: bm.id, patch: { title: f.querySelector('[data-k=title]').value, url: f.querySelector('[data-k=url]').value } }).then(() => bookmarks(s.value));
      };
    }
  };
}

// ---------------- Verlauf
function day(ts) {
  const d = new Date(ts), t = new Date(); t.setHours(0, 0, 0, 0);
  const diff = Math.round((t - new Date(ts).setHours(0, 0, 0, 0)) / 864e5);
  return diff === 0 ? 'Heute' : diff === 1 ? 'Gestern' : d.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
}
async function history(filter = '') {
  const list = (await api.call('history', filter)) || [];
  const keep = document.activeElement && document.activeElement.classList.contains('search');
  let html = `<input class="search" placeholder="Verlauf durchsuchen" value="${esc(filter)}">`, last = '';
  if (!filter) html += await devicesHtml();
  for (const h of list) {
    const d = day(h.visitedAt);
    if (d !== last) { html += `<div class="day">${esc(d)}</div>`; last = d; }
    html += item(h, `<time>${new Date(h.visitedAt).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })}</time><button class="ib" data-act="del" aria-label="Entfernen">✕</button>`);
  }
  if (!list.length) html += `<p class="empty">${filter ? 'Keine Treffer.' : 'Der Verlauf ist leer.'}</p>`;
  else if (!filter) html += `<section><button class="btn danger" id="go-clear">Gesamten Verlauf löschen</button></section>`;
  main.innerHTML = html;
  const s = main.querySelector('.search');
  if (keep) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
  s.oninput = () => history(s.value);
  main.onclick = e => {
    if (e.target.id === 'go-clear') { location.hash = '#settings'; setTimeout(() => $('#data').scrollIntoView(), 80); return; }
    const t = e.target.closest('.txt');
    if (t) return api.call('openUrl', t.dataset.url);
    const b = e.target.closest('[data-act=del]');
    if (b) { const row = b.closest('.item'); api.call('removeHistory', row.dataset.id).then(() => row.remove()); }
  };
}

// ---------------- Downloads (Android-Downloadverwaltung, nur die von Sakura)
let dlTimer = null;
const fmtSize = b => !(b > 0) ? '' : b >= 1073741824 ? (b / 1073741824).toLocaleString('de-DE', { maximumFractionDigits: 1 }) + ' GB'
  : b >= 1048576 ? (b / 1048576).toLocaleString('de-DE', { maximumFractionDigits: 1 }) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
const ext = t => { const m = /\.([a-z0-9]{1,4})$/i.exec(String(t || '')); return m ? m[1].toUpperCase() : 'DATEI'; };
async function downloads() {
  const list = (await api.call('downloads')) || [];
  if (location.hash !== '#downloads') return;
  let html = '';
  for (const d of list) {
    const pct = d.total > 0 ? Math.min(100, Math.round(d.received / d.total * 100)) : 0;
    const info = d.state === 'done' ? [fmtSize(d.total), new Date(d.at).toLocaleString('de-DE', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })].filter(Boolean).join(' · ')
      : d.state === 'failed' ? 'Fehlgeschlagen' : d.state === 'paused' ? 'Wartet auf Verbindung …'
      : `${pct} %${d.total > 0 ? ' · ' + fmtSize(d.received) + ' von ' + fmtSize(d.total) : ''}`;
    html += `<div class="item dl" data-id="${esc(d.id)}" data-state="${esc(d.state)}"><span class="fav">${esc(ext(d.title))}</span>
      <div class="txt"><div>${esc(d.title || 'Download')}</div><small class="${d.state === 'failed' ? 'failed' : ''}">${esc(info)}</small>
      ${d.state === 'running' || d.state === 'paused' ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ''}</div>
      <button class="ib" data-act="del" aria-label="${d.state === 'done' ? 'Datei löschen' : 'Abbrechen'}">✕</button></div>`;
  }
  if (!list.length) html = '<p class="empty">Noch keine Downloads. Was du in Sakura herunterlädst, erscheint hier und landet im Ordner „Download“ deines Handys.</p>';
  html += `<section><button class="btn" id="dl-folder">Download-Ordner öffnen</button></section>`;
  main.innerHTML = html;
  $('#dl-folder').onclick = () => api.call('downloadsFolder');
  main.onclick = async e => {
    const row = e.target.closest('.item');
    if (!row) return;
    if (e.target.closest('[data-act=del]')) {
      if (row.dataset.state === 'done' && !confirm('Datei vom Handy löschen?')) return;
      await api.call('downloadRemove', row.dataset.id); downloads(); return;
    }
    if (row.dataset.state === 'done') api.call('downloadOpen', row.dataset.id);
  };
  if (list.some(d => d.state === 'running' || d.state === 'paused')) dlTimer = setTimeout(downloads, 1000);
}

async function devicesHtml() {
  const devs = ((await api.call('devices')) || []).filter(d => d.tabs && d.tabs.length);
  if (!devs.length) return '';
  return devs.map(d => `<div class="device"><h3>${esc(d.name || 'Gerät')}<small>${d.platform === 'android' ? 'Handy' : 'PC'} – ${esc(ago(d.updatedAt))}</small></h3>` +
    d.tabs.slice(0, 15).map(t => item({ id: '', url: t.url, title: t.title }, '')).join('') + '</div>').join('') +
    '<div class="day">Verlauf auf diesem Handy</div>';
}

// ---------------- Eigene Skripte
function parseMeta(code) {
  const m = /==UserScript==([\s\S]*?)==\/UserScript==/.exec(code);
  if (!m) return null;
  const out = { name: '', match: [] };
  for (const line of m[1].split('\n')) {
    const r = /@(\w+)\s+(.+)/.exec(line);
    if (!r) continue;
    if (r[1] === 'name' && !out.name) out.name = r[2].trim();
    if (r[1] === 'match' || r[1] === 'include') out.match.push(r[2].trim());
  }
  return out;
}
async function scripts() {
  const list = (await api.call('scripts')) || [];
  let html = `<div class="row" style="justify-content:flex-start;margin:4px 0 8px"><button class="btn primary" data-a="new">Neues Skript</button></div>
    <p>Skripte laufen automatisch auf den Seiten, die du angibst – zum Beispiel um Elemente auszublenden. Sie werden mit dem PC abgeglichen.</p>`;
  if (!list.length) html += '<p class="empty">Noch keine Skripte.</p>';
  for (const sc of list) html += `<div class="script" data-id="${esc(sc.id)}"><div class="txt" data-a="edit"><div>${esc(sc.name)}</div><small>${esc((sc.match || []).join('  '))}</small></div>
    <label class="sw"><input type="checkbox" data-a="toggle"${sc.enabled !== false ? ' checked' : ''}></label></div>`;
  main.innerHTML = html;
  main.onclick = e => {
    const b = e.target.closest('[data-a]');
    if (!b) return;
    if (b.dataset.a === 'new') editScript(null);
    if (b.dataset.a === 'edit') editScript(list.find(x => x.id === b.closest('.script').dataset.id));
  };
  main.onchange = e => {
    const t = e.target.closest('input[data-a=toggle]');
    if (t) api.call('setScriptEnabled', { id: t.closest('.script').dataset.id, enabled: t.checked });
  };
}
async function editScript(sc) {
  const host = sc ? '' : await api.call('currentHost');
  const def = host ? `*://*.${host}/*` : '';
  main.onchange = null;
  main.innerHTML = `<section>
    <label class="f">Name<input id="n" value="${esc(sc ? sc.name : '')}" placeholder="z. B. YouTube aufräumen"></label>
    <label class="f">Seiten (ein Muster pro Zeile, z. B. youtube.com)<textarea id="m" class="matches" spellcheck="false" autocapitalize="off">${esc(sc ? (sc.match || []).join('\n') : def)}</textarea></label>
    <label class="f">Code (JavaScript)<textarea id="c" class="code" spellcheck="false" autocapitalize="off" placeholder="document.querySelector('#werbung')?.remove();">${esc(sc ? sc.code : '')}</textarea></label>
    <p class="err" id="e" hidden></p>
    <div class="row">${sc ? '<button class="btn danger" data-a="del" style="margin-right:auto">Löschen</button>' : ''}<button class="btn" data-a="back">Abbrechen</button><button class="btn primary" data-a="save">Speichern</button></div>
  </section>`;
  const code = $('#c');
  code.addEventListener('input', () => {
    const meta = parseMeta(code.value);
    if (!meta) return;
    if (!$('#n').value.trim() && meta.name) $('#n').value = meta.name;
    if ((!$('#m').value.trim() || $('#m').value === def) && meta.match.length) $('#m').value = meta.match.join('\n');
  });
  main.onclick = async e => {
    const a = e.target.dataset && e.target.dataset.a;
    if (a === 'back') scripts();
    if (a === 'del') { await api.call('deleteScript', sc.id); scripts(); }
    if (a === 'save') {
      const match = $('#m').value.split('\n').map(x => x.trim()).filter(Boolean);
      if (!code.value.trim() || !match.length) {
        $('#e').textContent = !code.value.trim() ? 'Der Code ist leer.' : 'Gib mindestens eine Seite an.'; $('#e').hidden = false; return;
      }
      await api.call('saveScript', { id: sc && sc.id, name: $('#n').value, match, code: code.value, enabled: sc ? sc.enabled !== false : true });
      scripts();
    }
  };
}

// ---------------- Einstellungen
const NAMES = { google: 'Google', duckduckgo: 'DuckDuckGo', ecosia: 'Ecosia', startpage: 'Startpage', bing: 'Bing' };
function ago(ts) {
  if (!ts) return 'noch nie';
  const m = Math.round((Date.now() - ts) / 60000);
  return m < 1 ? 'gerade eben' : m < 60 ? `vor ${m} Min.` : new Date(ts).toLocaleString('de-DE', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}
async function settings() {
  const p = await api.call('prefs');
  const si = await api.call('syncInfo');
  main.onclick = null;
  main.innerHTML = `
  <section id="sync">${syncHtml(si)}</section>
  <section>
    <h2>Suche</h2>
    <label class="f">Suchmaschine<select id="engine">${p.engines.map(e => `<option value="${e}"${e === p.searchEngine ? ' selected' : ''}>${NAMES[e] || e}</option>`).join('')}</select></label>
  </section>
  <section id="design">
    <h2>Design</h2>
    <div class="themes">${(window.SakuraThemes ? SakuraThemes.list : []).map(t => `
      <button class="theme${t.id === (p.theme || 'sakura') ? ' on' : ''}" data-theme="${esc(t.id)}" style="--t-bg:${esc(t.yoru)};--t-ac:${esc(t.accent)}"><i></i><span>${esc(t.label)}</span></button>`).join('')}</div>
    <div class="row" style="justify-content:space-between;align-items:center">
      <label class="accent">Eigene Akzentfarbe <input type="color" id="accent" value="${esc(p.accent || SakuraThemes.resolve(p).colors.accent)}"></label>
      <button class="btn" id="accent-reset"${p.accent ? '' : ' hidden'}>Farbe des Designs</button>
    </div>
  </section>
  <section>
    <h2>Darstellung</h2>
    <label class="sw"><input type="checkbox" id="dark"${p.siteTheme === 'force' ? ' checked' : ''}><span>Auch Seiten ohne Dunkelmodus dunkel anzeigen</span></label>
  </section>
  <section>
    <h2>Werbeblocker</h2>
    <label class="sw"><input type="checkbox" id="ab"${p.adblock ? ' checked' : ''}><span>Werbung und Tracker blockieren</span></label>
    <label class="sw"><input type="checkbox" id="abx"${p.adblockExtended ? ' checked' : ''}><span>Erweiterte Liste (rund 80.000 Domains)</span></label>
    <p id="abinfo">${Number(p.blocklistSize).toLocaleString('de-DE')} Domains auf der Sperrliste.</p>
    <label class="f">Ausnahmen – hier nichts blockieren (eine Seite pro Zeile)<textarea id="allow" spellcheck="false">${esc((p.adblockAllow || []).join('\n'))}</textarea></label>
  </section>
  <section>
    <h2>YouTube</h2>
    <label class="sw"><input type="checkbox" id="yt-on"${p.youtube !== false ? ' checked' : ''}><span>Werbung in Videos überspringen und ausblenden</span></label>
    <label class="sw"><input type="checkbox" id="yt-sb"${p.ytSponsor !== false ? ' checked' : ''}><span>Sponsor-Abschnitte überspringen (SponsorBlock)</span></label>
    <label class="f">Videoqualität<select id="yt-q">${[['hd1080', '1080p (Full HD)'], ['hd720', '720p'], ['hd1440', '1440p'], ['hd2160', '2160p (4K)'], ['max', 'Höchste verfügbare'], ['auto', 'Wie YouTube es wählt']]
      .map(([v, l]) => `<option value="${v}"${(p.ytQuality || 'hd1080') === v ? ' selected' : ''}>${l}</option>`).join('')}</select></label>
  </section>
  <section>
    <h2>Videos und Serien</h2>
    <label class="sw"><input type="checkbox" id="vd-resume"${p.videoResume !== false ? ' checked' : ''}><span>Dort weiterschauen, wo du aufgehört hast</span></label>
    <label class="sw"><input type="checkbox" id="vd-intro"${p.skipIntro !== false ? ' checked' : ''}><span>Intro und Rückblick überspringen</span></label>
    <label class="sw"><input type="checkbox" id="vd-next"${p.autoNext !== false ? ' checked' : ''}><span>Nächste Folge automatisch starten</span></label>
  </section>
  <section>
    <h2>Cookie-Banner</h2>
    <label class="sw"><input type="checkbox" id="ck-on"${p.cookieReject !== false ? ' checked' : ''}><span>Cookie-Banner automatisch ablehnen</span></label>
    <p>Sakura klickt bei Zustimmungsfenstern auf „Alle ablehnen“ oder „Nur notwendige“. Eine Ausnahme setzt du über das Schild.</p>
    <label class="f">Ausnahmen – hier nichts ablehnen (eine Seite pro Zeile)<textarea id="ck-allow" spellcheck="false">${esc((p.cookieAllow || []).join('\n'))}</textarea></label>
  </section>
  <section>
    <h2>Startseite</h2>
    <label class="sw"><input type="checkbox" id="bg-builtin"${p.bgBuiltin !== false ? ' checked' : ''}><span>Sakura-Hintergrundbilder zeigen</span></label>
    <p>Die Bilder wechseln automatisch mit einem weichen Übergang. Ohne Bilder zeigt die Startseite die gezeichnete Nacht mit Kirschblüten.</p>
    <label class="f">Eigene Hintergrundbilder (Bild-Adressen, eine pro Zeile)<textarea id="bgs" spellcheck="false">${esc((p.backgrounds || []).join('\n'))}</textarea></label>
    <label class="f">Bild wechseln alle … Minuten<input id="bgmin" type="number" min="1" value="${p.bgMinutes || 1}"></label>
  </section>
  <section>
    <h2>Privatmodus</h2>
    <p>${p.privateProfiles
      ? 'Private Tabs speichern keinen Verlauf. Cookies und Anmeldungen aus privaten Tabs werden gelöscht, sobald der letzte private Tab geschlossen ist.'
      : 'Private Tabs speichern keinen Verlauf und keinen Cache. Dein Android-WebView ist zu alt für getrennte Cookies – aktualisiere „Android System WebView“ im Play Store, damit private Tabs eigene Cookies bekommen.'}</p>
  </section>
  <section id="about">
    <h2>Über Sakura</h2>
    <p id="ver"></p>
    <div class="row" style="justify-content:flex-start"><button class="btn" id="upd" hidden>Nach Updates suchen</button></div>
    <p id="updmsg"></p>
  </section>
  <section id="data">
    <h2>Daten</h2>
    <label class="sw"><input type="checkbox" id="ck"><span>Auch Cookies und Anmeldungen löschen</span></label>
    <div class="row" style="justify-content:flex-start"><button class="btn danger" id="clr">Verlauf und Cache löschen</button></div>
  </section>`;
  $('#engine').onchange = e => api.call('setPrefs', { searchEngine: e.target.value });
  const setDesign = async patch => {
    Object.assign(p, patch);
    applyTheme(p);
    if (!p.accent) $('#accent').value = SakuraThemes.resolve(p).colors.accent;
    $('#accent-reset').hidden = !p.accent;
    await api.call('setPrefs', patch);
  };
  document.querySelectorAll('[data-theme]').forEach(b => b.onclick = () => {
    document.querySelectorAll('[data-theme]').forEach(x => x.classList.toggle('on', x === b));
    setDesign({ theme: b.dataset.theme });
  });
  $('#accent').onchange = e => setDesign({ accent: e.target.value });
  $('#accent-reset').onclick = () => setDesign({ accent: '' });
  $('#dark').onchange = e => api.call('setPrefs', { siteTheme: e.target.checked ? 'force' : 'dark' });
  $('#ab').onchange = e => api.call('setPrefs', { adblock: e.target.checked });
  $('#abx').onchange = async e => {
    $('#abinfo').textContent = e.target.checked ? 'Liste wird geladen …' : '';
    const r = await api.call('setPrefs', { adblockExtended: e.target.checked });
    $('#abinfo').textContent = r && r.error ? r.error : `${Number(r.blocklistSize).toLocaleString('de-DE')} Domains auf der Sperrliste.`;
  };
  $('#allow').onchange = e => api.call('setPrefs', { adblockAllow: lines(e.target.value).map(host) });
  $('#yt-on').onchange = e => api.call('setPrefs', { youtube: e.target.checked });
  $('#yt-sb').onchange = e => api.call('setPrefs', { ytSponsor: e.target.checked });
  $('#yt-q').onchange = e => api.call('setPrefs', { ytQuality: e.target.value });
  $('#vd-resume').onchange = e => api.call('setPrefs', { videoResume: e.target.checked });
  $('#vd-intro').onchange = e => api.call('setPrefs', { skipIntro: e.target.checked });
  $('#vd-next').onchange = e => api.call('setPrefs', { autoNext: e.target.checked });
  $('#ck-on').onchange = e => api.call('setPrefs', { cookieReject: e.target.checked });
  $('#ck-allow').onchange = e => api.call('setPrefs', { cookieAllow: lines(e.target.value).map(u => host(/^https?:/.test(u) ? u : 'https://' + u)) });
  $('#bgs').onchange = e => api.call('setPrefs', { backgrounds: lines(e.target.value) });
  $('#bgmin').onchange = e => api.call('setPrefs', { bgMinutes: Math.max(1, Number(e.target.value) || 1) });
  $('#bg-builtin').onchange = e => api.call('setPrefs', { bgBuiltin: e.target.checked });
  api.call('updateInfo').then(u => {
    if (!u) return;
    $('#ver').textContent = `Version ${u.current}` + (u.webview ? ` – Webseiten-Engine (Android System WebView) ${u.webview}, wird vom Play Store aktuell gehalten.` : '');
    $('#upd').hidden = !u.repo;
    if (!u.repo) $('#updmsg').textContent = 'Diese Version wurde nicht über GitHub gebaut und sucht deshalb nicht selbst nach Updates.';
  });
  $('#upd').onclick = async () => {
    $('#upd').disabled = true; $('#updmsg').textContent = 'Suche …';
    const r = await api.call('updateCheck');
    $('#upd').disabled = false; $('#updmsg').textContent = (r && r.message) || '';
  };
  $('#clr').onclick = async () => { $('#clr').disabled = true; await api.call('clearHistory', { cookies: $('#ck').checked }); $('#clr').textContent = 'Gelöscht'; };
  bindSync();
}
function syncHtml(si) {
  si = si || {};
  if (si.mode === 'code') {
    const label = { ok: `Synchronisiert ${ago(si.lastSync)}`, syncing: si.message || 'Synchronisiere …', error: si.message || 'Fehler', idle: `Zuletzt ${ago(si.lastSync)}` }[si.state] || '';
    return `<h2>Synchronisation</h2><div class="status ${esc(si.state)}"><i></i><span>${esc(label)}</span></div>
      <p>Alle Geräte mit diesem Sync-Code gleichen sich automatisch ab – Ende-zu-Ende-verschlüsselt.</p>
      <p>Dein Sync-Code: <code id="code" style="filter:blur(5px)">${esc(si.code)}</code> <small>(antippen zum Anzeigen)</small></p>
      <div class="row" style="justify-content:flex-start"><button class="btn primary" id="now">Jetzt synchronisieren</button><button class="btn" id="out">Trennen</button></div>`;
  }
  if (!si.email && (!si.state || si.state === 'off')) {
    return `<h2>Synchronisation</h2>
      <p>Gib den Sync-Code ein, den dir Sakura auf dem PC zeigt (Einstellungen → Synchronisation). Danach gleichen sich deine Geräte automatisch ab.</p>
      <label class="f">Sync-Code<input id="codein" spellcheck="false" autocapitalize="characters" autocomplete="off" placeholder="XXXXX-XXXXX-XXXXX-XXXXX"></label>
      <p class="err" id="err" hidden>${esc(si.message || '')}</p>
      <div class="row" style="justify-content:flex-start"><button class="btn primary" id="connect">Verbinden</button><button class="btn" id="newcode">Neuen Code erstellen</button></div>
      <details><summary>Stattdessen ein eigenes Firebase-Projekt verwenden</summary>${firebaseHtml(si)}</details>`;
  }
  if (si.email && si.state === 'needkey') {
    return `<h2>Synchronisation</h2>
      <div class="status error"><i></i><span>${esc(si.message || 'Sync-Passwort fehlt – der Abgleich ist pausiert.')}</span></div>
      <p>Angemeldet als ${esc(si.email)}. Gib dein Sync-Passwort ein, um den Abgleich zu entsperren.</p>
      <label class="f">Sync-Passwort<input id="sp" type="password" autocomplete="off"></label>
      <p class="err" id="err" hidden></p>
      <div class="row" style="justify-content:flex-start"><button class="btn primary" id="unlock">Entsperren</button><button class="btn" id="out">Abmelden</button></div>
      <details><summary>Sync-Passwort vergessen?</summary>
        <p>Dann kannst du die Daten auf dem Server mit dem oben eingegebenen neuen Passwort neu anlegen. Sie werden durch die Daten dieses Handys ersetzt.</p>
        <button class="btn danger" id="reset">Mit neuem Passwort neu anlegen</button>
      </details>`;
  }
  if (si.email && si.state !== 'off') {
    const label = { ok: `Synchronisiert ${ago(si.lastSync)}`, syncing: si.message || 'Synchronisiere …', error: si.message || 'Fehler', idle: `Zuletzt ${ago(si.lastSync)}` }[si.state] || '';
    return `<h2>Synchronisation</h2><div class="status ${esc(si.state)}"><i></i><span>${esc(label)}</span></div>
      <p>Angemeldet als ${esc(si.email)}. Ende-zu-Ende-verschlüsselt: Lesezeichen, Kacheln, Verlauf, offene Tabs, Skripte und Einstellungen sind nur auf deinen Geräten lesbar.</p>
      <div class="row" style="justify-content:flex-start"><button class="btn primary" id="now">Jetzt synchronisieren</button><button class="btn" id="chg">Sync-Passwort ändern</button><button class="btn" id="out">Abmelden</button></div>
      <div id="chgbox" hidden style="margin-top:12px">
        <label class="f">Neues Sync-Passwort<input id="n1" type="password" autocomplete="new-password"></label>
        <label class="f">Wiederholen<input id="n2" type="password" autocomplete="new-password"></label>
        <p class="err" id="err" hidden></p>
        <button class="btn primary" id="chggo">Ändern</button>
      </div>`;
  }
  return `<h2>Synchronisation</h2>${firebaseHtml(si)}`;
}
function firebaseHtml(si) {
  return `
    <p>Melde dich mit demselben Konto und Sync-Passwort an wie im Sakura-Browser auf dem PC.</p>
    <details><summary>Woher bekomme ich die Werte?</summary><ol>
      <li>Firebase-Konsole → dein Projekt → Projekteinstellungen.</li>
      <li>„Web-API-Schlüssel“ und „Projekt-ID“ abschreiben – dieselben wie am PC.</li>
    </ol></details>
    <label class="f">Web-API-Schlüssel<input id="k" spellcheck="false" autocapitalize="off" value="${esc(si.apiKey || '')}"></label>
    <label class="f">Projekt-ID<input id="pid" spellcheck="false" autocapitalize="off" value="${esc(si.projectId || '')}"></label>
    <label class="f">E-Mail<input id="mail" type="email" autocapitalize="off" value="${esc(si.email || '')}"></label>
    <label class="f">Konto-Passwort<input id="pw" type="password"></label>
    <label class="f">Sync-Passwort (mind. 8 Zeichen)<input id="sp" type="password" autocomplete="off"></label>
    <p>Damit werden deine Daten verschlüsselt, bevor sie das Handy verlassen – auch Google kann sie nicht lesen. Auf allen Geräten dasselbe verwenden. Vergisst du es, sind die Daten auf dem Server verloren; deine Geräte behalten ihre eigenen.</p>
    <p class="err" id="err" hidden></p>
    <div class="row" style="justify-content:flex-start"><button class="btn primary" id="in">Anmelden</button><button class="btn" id="new">Konto anlegen</button></div>`;
}
function bindSync() {
  const sec = $('#sync');
  const showErr = m => { const e = $('#err'); if (e) { e.textContent = m; e.hidden = !m; } };
  const busy = on => { for (const b of sec.querySelectorAll('button')) b.disabled = on; };
  const redraw = r => { sec.innerHTML = syncHtml(r); bindSync(); };
  if ($('#now')) $('#now').onclick = async () => { $('#now').disabled = true; await api.call('syncNow'); setTimeout(refreshSync, 2500); };
  if ($('#out')) $('#out').onclick = async () => redraw(await api.call('syncLogout'));
  if ($('#chg')) $('#chg').onclick = () => { $('#chgbox').hidden = false; $('#n1').focus(); };
  if ($('#chggo')) $('#chggo').onclick = async () => {
    if ($('#n1').value !== $('#n2').value) return showErr('Die beiden Passwörter stimmen nicht überein.');
    busy(true);
    const r = await api.call('syncChangePassword', $('#n1').value);
    if (r.failed) { busy(false); return showErr(r.message); }
    redraw(r); setTimeout(refreshSync, 3000);
  };
  const unlock = reset => async () => {
    if (reset && !confirm('Die Daten auf dem Server werden durch die Daten dieses Handys ersetzt und mit dem eingegebenen Passwort neu verschlüsselt. Fortfahren?')) return;
    busy(true);
    const r = await api.call('syncUnlock', { password: $('#sp').value, reset });
    if (r.failed) { busy(false); return showErr(r.message); }
    redraw(r); setTimeout(refreshSync, 3000);
  };
  if ($('#unlock')) { $('#unlock').onclick = unlock(false); $('#reset').onclick = unlock(true); }
  const go = create => async () => {
    showErr('');
    busy(true);
    const r = await api.call('syncLogin', { apiKey: $('#k').value, projectId: $('#pid').value, email: $('#mail').value, password: $('#pw').value, syncPassword: $('#sp').value, create });
    if (r && r.state === 'error' && !r.email) { busy(false); return showErr(r.message); }
    redraw(r); setTimeout(refreshSync, 3000);
  };
  if ($('#in')) { $('#in').onclick = go(false); $('#new').onclick = go(true); }
  // Sync-Code
  const codeGo = (cmd, arg) => async () => {
    showErr('');
    busy(true);
    const r = await api.call(cmd, arg ? arg() : null);
    if (r && r.failed) { busy(false); return showErr(r.message); }
    redraw(r); setTimeout(refreshSync, 3000); setTimeout(refreshSync, 8000);
  };
  if ($('#connect')) { $('#connect').onclick = codeGo('syncConnectCode', () => $('#codein').value); $('#newcode').onclick = codeGo('syncCreateCode'); }
  if ($('#code')) $('#code').onclick = e => { e.target.style.filter = e.target.style.filter ? '' : 'blur(5px)'; };
}
async function refreshSync() {
  const sec = $('#sync');
  if (!sec || $('#pw') || $('#sp') || $('#codein') || ($('#chgbox') && !$('#chgbox').hidden)) return;
  sec.innerHTML = syncHtml(await api.call('syncInfo'));
  bindSync();
}
route();
</script>
</body>
</html>

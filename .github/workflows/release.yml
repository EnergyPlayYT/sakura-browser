# Baut Sakura für Windows und Android und veröffentlicht es als GitHub-Release.
# Installierte Sakura-Versionen holen sich dieses Release automatisch.
name: Sakura veröffentlichen

on:
  workflow_dispatch:          # „Run workflow“ in GitHub drücken
  workflow_call:              # wird vom wöchentlichen Sicherheitsupdate aufgerufen
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'android/**'
      - '!desktop/test/**'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Versionsnummer festlegen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: v
        name: Version erhöhen, falls es sie schon gibt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git pull --ff-only origin main || true
          cd desktop
          V=$(node -p "require('./package.json').version")
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            npm version patch --no-git-tag-version >/dev/null
            V=$(node -p "require('./package.json').version")
            git config user.name "sakura-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Sakura $V"
            git push origin HEAD:main
          fi
          git tag "v$V"
          git push origin "v$V"
          # Release einmal vorab anlegen – sonst legen parallele Uploads es doppelt an
          # Verständliche Beschreibung für die Download-Seite: alle Änderungen seit der letzten Version
          PREV=$(git describe --tags --abbrev=0 "v$V^" 2>/dev/null || true)
          {
            echo "## Was ist neu in Sakura $V?"
            echo
            git log --no-merges --format='%x1e%s%n%n%b' ${PREV:+"$PREV..v$V"} -- ':/desktop' ':/android' | python3 -c '
          import sys, re
          for c in sys.stdin.read().split("\x1e"):
              lines = c.strip().splitlines()
              if not lines or re.fullmatch(r"Sakura [0-9.]+", lines[0]): continue
              body = [l for l in lines[1:] if not re.match(r"(Co-Authored-By|Claude-Session):", l)]
              print("### " + lines[0] + "\n" + "\n".join(body).strip() + "\n")
          '
            echo
            echo "Installierte Sakura-Versionen aktualisieren sich von selbst. Neu installieren: Windows **Sakura-Setup-$V.exe**, Linux **Sakura-$V.AppImage**, Android **Sakura-$V.apk** – unten bei den Dateien."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          # Erst als Entwurf: sichtbar (und für die Auto-Updates auffindbar) wird die Version erst,
          # wenn der Windows-Build latest.yml und den Installer hochgeladen hat
          gh release create "v$V" --title "Sakura $V" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag --draft
          echo "version=$V" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows bauen
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abhängigkeiten installieren
        working-directory: desktop
        run: npm install
      - name: Repo für Updates eintragen
        working-directory: desktop
        shell: bash
        run: npm pkg set "repository.type=git" "repository.url=https://github.com/${GITHUB_REPOSITORY}.git"
      - name: Bauen und veröffentlichen
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis portable --publish always
      - name: Store-Paket bauen (Microsoft Store, nur wenn der Publisher eingetragen ist)
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! node -e "process.exit(require('./package.json').build.appx.publisher ? 0 : 1)"; then echo "Kein Publisher eingetragen – Store-Paket übersprungen."; exit 0; fi
          npx electron-builder --win appx --publish never
          gh release upload "v${{ needs.version.outputs.version }}" dist/Sakura-Store-*.appx --clobber --repo "$GITHUB_REPOSITORY"

  linux:
    name: Linux bauen
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abhängigkeiten installieren
        working-directory: desktop
        run: npm install
      - name: Repo für Updates eintragen
        working-directory: desktop
        run: npm pkg set "repository.type=git" "repository.url=https://github.com/${GITHUB_REPOSITORY}.git"
      - name: Bauen und veröffentlichen (AppImage)
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux AppImage --publish always

  android:
    name: Android bauen
    needs: [version, windows]
    runs-on: ubuntu-latest
    env:
      # Ein einziges Secret ANDROID_SIGNING = "Alias:Passwort:Schlüssel-als-Base64" (oder die vier einzelnen Secrets)
      HAS_KEY: ${{ secrets.ANDROID_SIGNING != '' || secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
      - name: Hinweis, falls der Signaturschlüssel fehlt
        if: env.HAS_KEY != 'true'
        run: echo "::warning::Kein Android-Signaturschlüssel hinterlegt (Secret ANDROID_SIGNING). Die Android-App wird übersprungen – siehe LIESMICH.md."
      - uses: actions/setup-java@v4
        if: env.HAS_KEY == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: env.HAS_KEY == 'true'
        with:
          gradle-version: '8.11.1'
      - name: APK bauen
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          SAKURA_SIGNING: ${{ secrets.ANDROID_SIGNING }}
          SAKURA_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SAKURA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SAKURA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SAKURA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$SAKURA_SIGNING" ]; then
            # Alias:Passwort:Base64 (Base64 enthält keinen Doppelpunkt)
            IFS=':' read -r SAKURA_KEY_ALIAS SAKURA_KEYSTORE_PASSWORD SAKURA_KEYSTORE_BASE64 <<< "$(echo "$SAKURA_SIGNING" | tr -d '[:space:]')"
            SAKURA_KEY_PASSWORD="$SAKURA_KEYSTORE_PASSWORD"
            export SAKURA_KEY_ALIAS SAKURA_KEYSTORE_PASSWORD SAKURA_KEY_PASSWORD
          fi
          echo "$SAKURA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sakura.jks"
          export SAKURA_KEYSTORE="$RUNNER_TEMP/sakura.jks"
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Sakura-${{ needs.version.outputs.version }}.apk"
      - name: APK zum Release hinzufügen
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=v${{ needs.version.outputs.version }}
          gh release view "$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$V" --repo "$GITHUB_REPOSITORY" --title "Sakura ${{ needs.version.outputs.version }}" --notes "Neue Sakura-Version"
          gh release upload "$V" "$RUNNER_TEMP/Sakura-${{ needs.version.outputs.version }}.apk" --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    name: Version freigeben
    # erst wenn Windows-Installer (latest.yml) und – falls möglich – die APK hochgeladen sind
    needs: [version, windows, android, linux]
    if: always() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Entwurf veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ needs.version.outputs.version }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Spiele-Overlay</title>
<link rel="stylesheet" href="ki.css">
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<header>
  <span class="seal">桜</span>
  <b id="title">Spiele-Overlay</b>
  <label class="op" title="Deckkraft"><input type="range" id="op" min="25" max="100" value="90"><output id="op-v">90 %</output></label>
  <button id="through" title="Klicks gehen ans Spiel durch (Strg+Alt+L)">Durchklicken</button>
  <button id="back" class="ic" title="Zurück in den Tab"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</header>
<script src="overlay.js"></script>
</body>
</html>
